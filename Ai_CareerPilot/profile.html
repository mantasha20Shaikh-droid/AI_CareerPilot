{% extends 'base.html' %}{% block title %}Profile · AI CareerPilot{% endblock %}{% block content %}<div class="content-narrow"><span class="eyebrow">YOUR ACCOUNT</span><h1 class="page-title">Profile</h1><div class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name</label><input class="form-control field" name="full_name" value="{{ current_user.full_name }}" required><label class="mt-3">Username</label><input class="form-control field" value="{{ current_user.username }}" disabled><label class="mt-3">Email</label><input class="form-control field" value="{{ current_user.email }}" disabled><label class="mt-3">Target job role</label><input class="form-control field" name="target_role" value="{{ current_user.target_role }}"><label class="mt-3">Experience level</label><select class="form-select field" name="experience_level">{% for x in ['Internship','Entry level','Mid level','Senior'] %}<option {% if current_user.experience_level==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><label class="mt-3">Learning goals</label><textarea class="form-control field" name="learning_goals" rows="4">{{ current_user.learning_goals }}</textarea><button class="btn btn-purple mt-4">Save profile</button></form></div></div>{% endblock %}
